<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Potateroid Protocol: Final Crunch</title>
  <style>
    :root {
      --bg1: #03011a;
      --bg2: #1a0b2e;
      --hot: #ff7b00;
      --gold: #ffca3a;
      --acid: #c7ff00;
      --danger: #ff2d55;
      --ice: #8ecae6;
    }

    * { box-sizing: border-box; }

    body {
      margin: 0;
      min-height: 100vh;
      font-family: "Trebuchet MS", "Comic Sans MS", cursive, sans-serif;
      color: #fff;
      overflow: hidden;
      background: radial-gradient(circle at 30% 20%, #3a1b6c 0%, var(--bg1) 35%, #000 100%);
    }

    .stars, .stars::before, .stars::after {
      content: "";
      position: absolute;
      inset: 0;
      background-image:
        radial-gradient(2px 2px at 20% 30%, #fff 50%, transparent 51%),
        radial-gradient(1px 1px at 80% 10%, #fff 40%, transparent 41%),
        radial-gradient(1px 1px at 60% 70%, #fff 50%, transparent 51%),
        radial-gradient(2px 2px at 40% 90%, #fff 50%, transparent 51%),
        radial-gradient(1px 1px at 10% 60%, #fff 50%, transparent 51%);
      animation: drift 35s linear infinite;
      opacity: 0.6;
      pointer-events: none;
    }

    .stars::before { transform: scale(1.2); animation-duration: 50s; opacity: 0.4; }
    .stars::after { transform: scale(1.5); animation-duration: 70s; opacity: 0.25; }

    @keyframes drift {
      from { transform: translateY(0); }
      to { transform: translateY(100px); }
    }

    .potato {
      position: absolute;
      width: min(72vw, 720px);
      aspect-ratio: 1;
      border-radius: 52% 48% 44% 56% / 48% 50% 50% 52%;
      background:
        radial-gradient(circle at 35% 30%, #d79f55 0%, #a9672e 45%, #6e3d18 100%);
      right: -16vw;
      top: -40vh;
      transform: rotate(-12deg);
      box-shadow: 0 0 120px #ff8a0055, inset -20px -30px 70px #4d250d;
      animation: doomDrop 16s linear infinite;
      z-index: 1;
    }

    .potato::before, .potato::after {
      content: "";
      position: absolute;
      border-radius: 50%;
      background: #5b2d12;
      opacity: 0.5;
    }

    .potato::before { width: 12%; height: 10%; left: 20%; top: 25%; }
    .potato::after { width: 10%; height: 8%; right: 26%; top: 55%; }

    @keyframes doomDrop {
      0% { transform: translate(0, 0) rotate(-12deg) scale(0.28); }
      70% { transform: translate(-45vw, 62vh) rotate(18deg) scale(1); }
      100% { transform: translate(-58vw, 88vh) rotate(32deg) scale(1.45); }
    }

    .alert {
      position: absolute;
      top: 18px;
      left: 50%;
      transform: translateX(-50%);
      z-index: 3;
      background: #00000090;
      border: 2px dashed var(--danger);
      padding: 10px 20px;
      font-size: clamp(0.9rem, 2.2vw, 1.2rem);
      letter-spacing: 0.12em;
      text-transform: uppercase;
      animation: blink 1s steps(2, jump-none) infinite;
    }

    @keyframes blink { 50% { opacity: 0.35; } }

    .content {
      position: relative;
      z-index: 2;
      height: 100vh;
      display: grid;
      place-items: center;
      text-align: center;
      padding: 6vh 4vw;
    }

    h1 {
      margin: 0;
      font-size: clamp(2rem, 6vw, 5rem);
      line-height: 1.05;
      text-transform: uppercase;
      color: var(--gold);
      text-shadow: 0 0 20px #ff7b00, 0 0 60px #ff7b00aa;
    }

    .tagline {
      margin: 14px 0 22px;
      font-size: clamp(1rem, 2.8vw, 1.5rem);
      color: var(--ice);
      max-width: 850px;
    }

    .countdown {
      font-family: "Impact", "Arial Black", sans-serif;
      font-size: clamp(2.2rem, 12vw, 9rem);
      letter-spacing: 0.04em;
      line-height: 0.95;
      color: var(--acid);
      text-shadow: 0 0 20px #b6ff00, 0 0 40px #b6ff00aa;
      margin-bottom: 10px;
    }

    .sub {
      font-size: clamp(0.85rem, 2.3vw, 1.2rem);
      color: #ffd6a5;
      text-transform: uppercase;
      letter-spacing: 0.08em;
    }

    .cta {
      margin-top: 20px;
      display: inline-block;
      padding: 12px 22px;
      border: 2px solid var(--hot);
      border-radius: 999px;
      color: #fff;
      background: #ff7b0022;
      text-decoration: none;
      font-weight: bold;
    }
  </style>
</head>
<body>
  <div class="stars"></div>
  <div class="potato" aria-hidden="true"></div>

  <div class="alert">Planetary Snack Alert • POTATEROID INCOMING</div>

  <main class="content">
    <section>
      <h1>The Great Potato Impact</h1>
      <p class="tagline">A colossal cosmic potato is descending from the heavens to flatten Earth into premium mashed territory. Buy before gravity does.</p>
      <div id="countdown" class="countdown">07:00:00:00</div>
      <div class="sub">Days : Hours : Minutes : Seconds Until Crunch</div>
      <a class="cta" href="#" aria-label="Join the potato resistance">Join the Tater Survivors Club</a>
    </section>
  </main>

  <script>
    const countdownEl = document.getElementById('countdown');
    const target = Date.now() + 7 * 24 * 60 * 60 * 1000;

    function updateCountdown() {
      const now = Date.now();
      let diff = Math.max(0, target - now);

      const days = Math.floor(diff / (1000 * 60 * 60 * 24));
      diff -= days * 1000 * 60 * 60 * 24;
      const hours = Math.floor(diff / (1000 * 60 * 60));
      diff -= hours * 1000 * 60 * 60;
      const minutes = Math.floor(diff / (1000 * 60));
      diff -= minutes * 1000 * 60;
      const seconds = Math.floor(diff / 1000);

      countdownEl.textContent =
        String(days).padStart(2, '0') + ':' +
        String(hours).padStart(2, '0') + ':' +
        String(minutes).padStart(2, '0') + ':' +
        String(seconds).padStart(2, '0');

      if (target - now <= 0) {
        countdownEl.textContent = '00:00:00:00';
      }
    }

    updateCountdown();
    setInterval(updateCountdown, 1000);
  </script>
</body>
</html>
